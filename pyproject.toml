[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fraudlens"
version = "1.0.0"
description = "Calibrated transaction fraud detection with temporal evaluation, SHAP and PSI"
requires-python = ">=3.12"
dependencies = ["catboost>=1.2,<2", "scikit-learn>=1.5,<2", "pandas>=2,<4", "numpy>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2"]
[tool.setuptools]
packages = ["fraudlens"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
